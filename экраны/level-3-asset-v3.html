<h2>Уровень 0 · Жизненный цикл актива: кросс-функциональные документы</h2>
<p class="subtitle">Этапы жизни актива и официальные кросс-функциональные документы каждого этапа: российский документ → мировой аналог. ⚠ — сверить.</p>

<style>
.fw{overflow-x:auto}
.fw .g{display:grid;grid-template-columns:150px repeat(6,minmax(0,1fr));gap:3px;min-width:860px;font-size:11.5px}
.fw .co{font-weight:600;padding:5px 6px;display:flex;align-items:center}
.fw .ph{padding:5px 6px;border-radius:4px;background:#8a6fd022;border:1px solid #8a6fd055;line-height:1.25}
.fw .ph.h{background:#8a6fd0;color:#fff;border:none;font-weight:600;text-align:center}
.fw .ph.kpra{background:#A23B2A;color:#fff;border:none;font-weight:600;text-align:center}
.dt{overflow-x:auto;margin-top:18px}
.dt table{border-collapse:collapse;width:100%;min-width:900px;font-size:12.5px}
.dt th,.dt td{border:1px solid #8885;padding:7px 9px;vertical-align:top;text-align:left}
.dt thead th{background:#8a6fd0;color:#fff}
.dt thead th.ru{background:#0F6E62}
.dt tr.stg td{background:#8a6fd01f;font-weight:700;font-size:13.5px}
.dt tr.stg td span{font-weight:400;opacity:.7;font-size:12px;margin-left:6px}
.dt td.ru{font-weight:600;width:28%}
.dt td.en{font-style:italic;width:24%}
.key{color:#A23B2A}
.gate{font-size:11px;padding:2px 7px;border-radius:4px;background:#8881;font-weight:400;float:right}
</style>

<div class="fw"><div class="g" id="fw"></div></div>
<div class="dt"><table id="dt"></table></div>

<script>
// этап: [название, англ., ворота, [[РФ документ, мировой аналог, что фиксирует, кто утверждает], ...]]
const S=[
 ["Поиск возможности","Identify","Ворота 1 · возможность есть",[
  ["Паспорт инвестиционной возможности","Opportunity Framing / Opportunity Statement","Цель, ресурсный потенциал, ориентир ценности","Инвестиционный комитет"],
  ["Лицензия на пользование недрами","Exploration Licence / PSC","Право на участок, лицензионные обязательства","Роснедра"],
  ["Программа ГРР актива","Exploration Strategy, Work Programme","Объём и очерёдность ГРР","Компания"]]],
 ["Оценка ценности","Assess / Appraise","Ворота 2 · концепция осуществима",[
  ["Концепция освоения месторождения","Feasibility / Concept Options Study","Варианты освоения: разработка, скважины, обустройство","Технический совет"],
  ["Проект пробной эксплуатации (ППЭ)","Appraisal Plan, Extended Well Test","Пробная добыча и исследования","ЦКР Роснедр"],
  ["Заключение по воротам 2","Value Assurance Review (VAR)","Независимая проверка готовности","Комиссия по воротам"]]],
 ["Выбор концепции","Select","Ворота 3 · выбор концепции",[
  ["Технологическая схема разработки (ТСР)","Field Development Plan (preliminary)","Система разработки, фонд, профили, КИН","ЦКР Роснедр"],
  ["Основные технические решения (ОТР) по активу","Concept Select Report, Basis of Design, DBSP (Aramco)","Выбранный вариант освоения","Технический совет"],
  ["<span class='key'>КПРА</span> — старт разработки","Integrated Asset Development Plan","Состав и границы комплексного проекта","Инвестиционный комитет"]]],
 ["Проект и инвестиционное решение","Define (FEED)","Ворота 4 · FID",[
  ["<span class='key'>КПРА — комплексный проект разработки актива</span> (за 1–3 года до строительства)","Integrated FDP; PDO (Норвегия); FDP (UK NSTA)","Согласованные решения геологии, разработки, скважин и инфраструктуры","Инвестиционный комитет"],
  ["<span class='key'>Бизнес-кейсы</span> в составе КПРА","Business Case; Project Proposal (Aramco)","Экономика каждого мероприятия или объекта","Инвестиционный комитет"],
  ["Технологический проект разработки (ТПР)","FDP — regulatory approval","Проектные показатели разработки","ЦКР Роснедр"],
  ["Инвестиционное решение","Final Investment Decision; Expenditure Request (Aramco); AFE","Утверждение финансирования","Совет директоров / правление"]]],
 ["Строительство и ввод","Execute","Ворота 5 · ввод в эксплуатацию",[
  ["<span class='key'>Годовой бизнес-план</span> из утверждённых бизнес-кейсов","Annual Work Programme & Budget (WP&B)","Программа работ и бюджет на год","Совет директоров / правление"],
  ["Корректировки бизнес-плана в течение года","WP&B revision","Изменения программы и бюджета","Правление"],
  ["Программа бурения и ввода объектов","Integrated Activity Plan (IAP)","Согласованный график работ всех направлений","Руководитель актива"],
  ["Отчёт о реализации проекта","Project Close-out Report, Handover","Итоги, передача в эксплуатацию","Комиссия"]]],
 ["Эксплуатация","Operate","Ворота 6 · прекращение добычи",[
  ["Дополнения к ТПР, авторский надзор","Revised FDP, Reservoir Management Plan","Актуализация разработки","ЦКР Роснедр"],
  ["Бизнес-кейсы на бурение, ГТМ, реконструкцию","Business Case / AFE","Экономика новых мероприятий","Инвестиционный комитет"],
  ["Годовой бизнес-план и его обновления","Asset Reference Plan, Annual WP&B","Программа и бюджет актива на год","Совет директоров / правление"],
  ["Постинвестиционный анализ","Post-Investment Review (PIR)","План/факт, уроки для следующих проектов","Инвестиционный комитет"]]]
];
const FW=[
 ["Shell · ORP ⚠",[["Identify & Assess",0,1],["Select",2,2],["Define",3,3],["Execute",4,4],["Operate",5,5]]],
 ["BP · CVP",[["Appraise",0,1],["Select",2,2],["Define",3,3],["Execute",4,4],["Operate",5,5]]],
 ["Chevron · CPDEP ⚠",[["1 Identify & assess",0,1],["2 Generate & select",2,2],["3 Develop preferred",3,3],["4 Execute",4,4],["5 Operate & evaluate",5,5]]],
 ["ExxonMobil ⚠",[["Opportunity",0,0],["Concept selection",1,2],["Define / FEED",3,3],["Execute",4,4],["Operations",5,5]]],
 ["Equinor · DG",[["DG0–DG1 Feasibility",0,1],["DG2 Concept",2,2],["DG3 PDO",3,3],["DG4 Execute",4,4],["Operate",5,5]]],
 ["Saudi Aramco",[["Study",0,1],["DBSP",2,2],["Project Proposal + ER",3,3],["Detail design, construction",4,4],["Operation",5,5]]],
 ["IPA · FEL",[["FEL 1",0,1],["FEL 2",2,2],["FEL 3",3,3],["Execute",4,4],["Operate",5,5]]],
 ["КПРА",[["КПРА · за 1–3 года до строительства",2,3]],"k"]
];
fw.innerHTML=`<div></div>`+S.map(s=>`<div class="ph h">${s[0]}</div>`).join("")+FW.map(([c,ph,t])=>`<div class="co">${c}</div>`+ph.map(([n,a,b])=>`<div class="ph ${t=="k"?"kpra":""}" style="grid-column:${a+2} / ${b+3}">${n}</div>`).join("")).join("");
dt.innerHTML=`<thead><tr><th class="ru">🇷🇺 Российский документ</th><th>🌐 Мировой аналог</th><th>Что фиксирует</th><th>Кто утверждает</th></tr></thead><tbody>`+
 S.map(([n,en,g,docs],i)=>`<tr class="stg"><td colspan="4">${i+1}. ${n}<span>${en}</span><span class="gate">◆ ${g}</span></td></tr>`+docs.map(d=>`<tr><td class="ru">${d[0]}</td><td class="en">${d[1]}</td><td>${d[2]}</td><td>${d[3]}</td></tr>`).join("")).join("")+`</tbody>`;
</script>
